name: Firewall Map release
on:
  push:
    tags: ['firewall-map-*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to the signed feed and GitHub Release (false = full signing rehearsal)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: firewall-map-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate version, tag, notes and source ancestry
        id: meta
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 tools/release/metadata.py metadata
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Verify frontend output and run tests
        run: |
          pip install pyyaml
          sh tools/build-renderer.sh --check
          python -m unittest discover -s security/firewall-map/tests
          python -m unittest discover -s tools/release/tests
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Build native FreeBSD package
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1
        with:
          release: '15.1'
          arch: amd64
          prepare: sh tools/release/prepare-freebsd.sh
          run: sh tools/release/build-freebsd.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firewall-map-package
          path: dist/
          if-no-files-found: error
          retention-days: 30
  sign:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: signed-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: packages
          path: _feed
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: firewall-map-package
          path: dist
      - name: Sign catalog and verify correct/wrong key behavior
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1
        env:
          PKG_SIGNING_KEY: ${{ secrets.PKG_SIGNING_KEY }}
        with:
          release: '15.1'
          arch: amd64
          envs: PKG_SIGNING_KEY
          prepare: pkg install -y git python313
          run: sh tools/release/sign-freebsd.sh
      - name: Archive ABI paths for artifact transport
        run: tar -czf signed-bundle.tar.gz -C signed .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firewall-map-signed
          path: signed-bundle.tar.gz
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: sign
    runs-on: ubuntu-24.04
    environment: signed-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: packages
          path: _feed
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: firewall-map-signed
          path: transfer
      - name: Unpack verified workflow artifact
        run: |
          mkdir signed
          tar -xzf transfer/signed-bundle.tar.gz -C signed
      - name: Verify publication bundle
        run: python3 tools/release/publish.py signed _feed --verify-only
      - name: Publish both channels from the same artifact
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/publish.py signed _feed
      - name: Summary
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          echo "Publication enabled: $PUBLISH" >> "$GITHUB_STEP_SUMMARY"
          cat signed/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
  record-feed-history:
    needs: publish
    if: github.event_name == 'push' || inputs.publish
    permissions:
      contents: write
    uses: ./.github/workflows/firewall-map-feed-history.yml
